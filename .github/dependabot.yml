# Раздача ядра (Ш-84 Штаба): раз в неделю Dependabot проверяет, вышел ли
# новый коммит FamilyCore, и открывает PR «поднять src/shared».
# CI проверяет его, сливает человек по зелёному. Изменение ядра, нужное
# приложению, приходит не отсюда, а задачей конвейера (Ш-48).
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Ядро"
